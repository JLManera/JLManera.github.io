<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Manera | CV</title>
    <meta name="description" content="Download the curriculum vitae of Jack Manera, an early-career researcher in behavioural ecology and ecotoxicology at Monash University.">
    <meta name="keywords" content="Jack Manera, CV, curriculum vitae, resume, behavioural ecology, ecotoxicology, Monash University">
    <meta property="og:title" content="Jack Manera | CV">
    <meta property="og:description" content="Download a copy of Jack Manera's curriculum vitae.">
    <meta property="og:url" content="https://www.jackmanera.com/cv.html">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://www.jackmanera.com/cv.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --primary: #1a5e3a;
            --primary-light: #2d8a56;
            --primary-dark: #0f3d25;
            --accent: #3a7ca5;
            --accent-light: #5ba3c9;
            --bg: #fafaf8;
            --bg-alt: #f0efe9;
            --text: #2c2c2c;
            --text-light: #5a5a5a;
            --text-lighter: #888;
            --white: #ffffff;
            --border: #ddd;
            --shadow: 0 2px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
            --radius: 8px;
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.7;
            font-size: 16px;
        }

        /* ── Navigation ── */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            transition: var(--transition);
        }
        nav.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }
        .nav-brand {
            font-family: 'Lora', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark);
            text-decoration: none;
        }
        .nav-links { display: flex; list-style: none; gap: 0.25rem; }
        .nav-links a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: var(--transition);
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
            background: rgba(26,94,58,0.06);
        }
        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text);
            padding: 0.5rem;
        }

        /* ── Sections ── */
        section { padding: 5rem 2rem; }
        section.first-section { padding-top: 8rem; }
        .section-inner { max-width: 1100px; margin: 0 auto; }
        .section-title {
            font-family: 'Lora', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }
        .section-subtitle {
            color: var(--text-light);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* ── CV page ── */
        #cv-page { background: var(--bg); }

        .cv-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .cv-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            transition: var(--transition);
        }

        .cv-btn.primary {
            background: var(--primary);
            color: var(--white);
            border: 1px solid var(--primary);
        }
        .cv-btn.primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .cv-btn.outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .cv-btn.outline:hover {
            background: rgba(26,94,58,0.06);
        }

        .cv-preview {
            width: 100%;
            height: 85vh;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            background: var(--white);
        }

        .cv-fallback {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .cv-fallback a { color: var(--accent); }

        /* ── Footer ── */
        footer {
            background: var(--primary-dark);
            color: rgba(255,255,255,0.5);
            text-align: center;
            padding: 2rem;
            font-size: 0.85rem;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: var(--white);
                flex-direction: column;
                padding: 1rem;
                box-shadow: var(--shadow);
            }
            .nav-links.open { display: flex; }
            .hamburger { display: block; }
            .cv-preview { height: 70vh; }
        }

        /* ── Animations ── */
        .fade-in {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .js-enabled .fade-in { opacity: 0; transform: translateY(20px); }
        .js-enabled .fade-in.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<!-- Navigation -->
<nav id="navbar">
    <div class="nav-inner">
        <a href="index.html" class="nav-brand">Jack L. Manera</a>
        <button class="hamburger" onclick="toggleMenu()" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">About</a></li>
            <li><a href="research.html">Research</a></li>
            <li><a href="software.html">Software</a></li>
            <li><a href="cv.html" class="active">CV</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
</nav>

<!-- CV Section -->
<section id="cv-page" class="first-section">
    <div class="section-inner">
        <h2 class="section-title fade-in">Curriculum Vitae</h2>
        <p class="section-subtitle fade-in">Download or preview a copy of my full CV</p>
        <div class="cv-actions fade-in">
            <a class="cv-btn primary" href="Jack_Manera_CV.pdf" download>
                <i class="fas fa-download"></i> Download CV (PDF)
            </a>
            <a class="cv-btn outline" href="Jack_Manera_CV.pdf" target="_blank" rel="noopener">
                <i class="fas fa-up-right-from-square"></i> Open in new tab
            </a>
        </div>
        <object class="cv-preview fade-in" data="Jack_Manera_CV.pdf" type="application/pdf">
            <p class="cv-fallback">
                Your browser can&rsquo;t display the embedded PDF.
                <a href="Jack_Manera_CV.pdf" download>Download the CV here</a> instead.
            </p>
        </object>
    </div>
</section>

<!-- Footer -->
<footer>
    &copy; 2026 Jack L. Manera.
</footer>

<script>
    document.documentElement.classList.add('js-enabled');

    function toggleMenu() {
        document.getElementById('navLinks').classList.toggle('open');
    }

    window.addEventListener('scroll', () => {
        const nav = document.getElementById('navbar');
        nav.classList.toggle('scrolled', window.scrollY > 50);
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            document.getElementById('navLinks').classList.remove('open');
        });
    });

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>
</body>
</html>
